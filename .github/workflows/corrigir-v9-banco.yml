name: Corrigir carregamento V9

on:
  push:
    paths:
      - 'tools/corrigir_v9_banco.py'
      - '.github/workflows/corrigir-v9-banco.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir V9
        run: python tools/corrigir_v9_banco.py
      - name: Validar regressao removida
        run: |
          grep -q "data/vibrasync_db_90893.json" quantum_vibrasync_v9_90893.html
          if grep -q "fetch('quantum_vibrasync_v8_90893.html'" quantum_vibrasync_v9_90893.html; then exit 1; fi
      - name: Publicar
        run: |
          git config user.name "VibraSync Builder"
          git config user.email "actions@users.noreply.github.com"
          git add quantum_vibrasync_v9_90893.html
          git diff --cached --quiet && exit 0
          git commit -m "V9: carregar banco direto sem baixar V8"
          git push
