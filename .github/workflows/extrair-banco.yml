name: Extrair banco VibraSync

on:
  push:
    paths:
      - 'tools/extrair_banco.py'
      - '.github/workflows/extrair-banco.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair banco original
        run: python tools/extrair_banco.py
      - name: Validar e publicar
        run: |
          test -s data/vibrasync_db_90893.json
          git config user.name "VibraSync Builder"
          git config user.email "actions@users.noreply.github.com"
          git add data/vibrasync_db_90893.json
          git diff --cached --quiet && exit 0
          git commit -m "Separar banco de 90.893 programas do HTML"
          git push
