name: Comparar V6 e V7

on:
  push:
    paths:
      - 'tools/comparar_v6_v7.py'
      - '.github/workflows/comparar-v6-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/comparar_v6_v7.py
      - run: |
          git config user.name "VibraSync Builder"
          git config user.email "actions@users.noreply.github.com"
          git add docs/diff_v6_v7_sem_banco.txt docs/resumo_v6_v7.json
          git diff --cached --quiet && exit 0
          git commit -m "Diagnosticar regressão V6 para V7"
          git push
